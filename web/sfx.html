<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sound-bytes · sound effects</title>
<style>
  :root { --bg:#1b1b1f; --panel:#26262c; --line:#3a3a42; --text:#e6e6ea; --dim:#9a9aa6; --accent:#ff4040; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  h1 { font-size:16px; margin:0 8px 0 0; }
  button, input, select { background:#34343c; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { background:#41414b; }
  input[type=search] { width:220px; }
  a { color:var(--dim); text-decoration:none; } a:hover { color:var(--text); }
  label { color:var(--dim); display:flex; align-items:center; gap:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { border-radius:999px; padding:3px 11px; font-size:12px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #status { margin-left:auto; color:var(--dim); font-family:ui-monospace, Menlo, monospace; font-size:12px; }
  main { padding:8px 16px 60px; max-width:1100px; margin:0 auto; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:22px 0 8px; font-weight:600; }
  section h2 small { font-weight:400; letter-spacing:0; text-transform:none; margin-left:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:8px; }
  .row { position:relative; overflow:hidden; display:flex; align-items:center; gap:10px; padding:9px 10px; background:var(--panel);
         border:1px solid var(--line); border-radius:8px; cursor:pointer; user-select:none; }
  .row:hover { border-color:#5a5a66; } .row:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .row.playing { border-color:var(--accent); }
  .row .bar-fill { position:absolute; left:0; bottom:0; height:3px; width:0; background:var(--accent); }
  .play { flex:none; width:30px; height:30px; border-radius:50%; background:#3d3d46; display:grid; place-items:center; font-size:12px; padding:0; }
  .row.playing .play { background:var(--accent); color:#fff; }
  .meta { min-width:0; flex:1; }
  .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .desc { color:var(--dim); font-size:12px; margin-top:1px; }
  .side { flex:none; text-align:right; font-size:11px; color:var(--dim); font-family:ui-monospace, Menlo, monospace; }
  .side a { display:block; margin-top:3px; }
  .empty { color:var(--dim); padding:30px 0; text-align:center; }
  .use { color:#80808c; font-size:11.5px; margin-top:3px; }
  .badges { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .badge { font-size:10.5px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .badge.pure { color:#8fd3ff; border-color:#2d5a73; } .badge.corrupted { color:#d78aff; border-color:#5d3a73; }
  .badge.off { color:#ffb36b; border-color:#74502b; } .badge.loop { color:#9be39b; border-color:#2f6a2f; }
  .row.looping .bar-fill { width:100% !important; transition:none !important; animation:sweep var(--dur, 4s) linear infinite; transform-origin:left; }
  @keyframes sweep { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  select { max-width:190px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Sound effects</h1>
    <input id="q" type="search" placeholder="Search sounds…  (e.g. sword, bell, heavy)" autocomplete="off">
    <label>Palette <select id="pal"><option value="all">all</option><option value="pure">pure</option><option value="corrupted">corrupted</option><option value="neutral">neutral</option></select></label>
    <label>Zone <select id="zone"><option value="all">all</option></select></label>
    <label>Fit <select id="fit"><option value="all">all sounds</option><option value="hide">hide off-theme</option><option value="core">core only</option></select></label>
    <label>Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    <button id="stop">■ Stop all</button>
    <button id="renderall" title="Render every sound to WAV files in out/sfx/ with the Python renderer">Render all to out/sfx/</button>
    <a href="index.html">&larr; Song editor</a>
    <span id="status"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="list"><div class="empty">Loading…</div></main>

<script src="synth.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
let TAX = {}, sounds = [], activeCat = "all", query = "", palF = "all", zoneF = "all", fitF = "all";
const catLabel = c => (TAX.categories && TAX.categories[c] && TAX.categories[c].label) || c.replace(/^\d+-/, "");
const zoneName = z => z === "any" ? "any zone" : ((TAX.zones && TAX.zones[z] && TAX.zones[z].name) || z);
let ctx = null, master = null;
const pcm = new Map();             // id -> Float32Array (rendered once, reused)
const playing = new Set();         // currently sounding {src, row, id}

function audio() {
  if (!ctx) { ctx = new AudioContext({ sampleRate: SR }); master = ctx.createGain(); master.gain.value = parseFloat($("vol").value); master.connect(ctx.destination); }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
function samplesFor(s) {
  if (!pcm.has(s.id)) { let mix = renderSongMix(s.song); if (s.loop) mix = wrapLoop(mix, s.loop); pcm.set(s.id, mix); }
  return pcm.get(s.id);
}
function stopEntry(e) { e.src.onended = null; try { e.src.stop(); } catch (_) {} playing.delete(e); if (![...playing].some(x => x.row === e.row)) clearRow(e.row); }
function clearRow(row) { row.classList.remove("playing", "looping"); const f = row.querySelector(".bar-fill"); f.style.transition = "none"; f.style.width = "0"; }
function play(s, row) {
  const existing = [...playing].filter(e => e.id === s.id);
  if (s.loop && existing.length) { existing.forEach(stopEntry); return; }      // clicking a running loop stops it
  const c = audio(), data = samplesFor(s);
  const buf = c.createBuffer(1, data.length, SR); buf.copyToChannel(data, 0);
  const src = c.createBufferSource(); src.buffer = buf; src.loop = !!s.loop; src.connect(master);
  const entry = { src, row, id: s.id };
  playing.add(entry);
  row.classList.add("playing");
  const fill = row.querySelector(".bar-fill");
  if (s.loop) { row.style.setProperty("--dur", buf.duration + "s"); row.classList.add("looping"); }
  else {
    fill.style.transition = "none"; fill.style.width = "0"; void fill.offsetWidth;
    fill.style.transition = `width ${Math.max(buf.duration, 0.05)}s linear`; fill.style.width = "100%";
    src.onended = () => stopEntry(entry);
  }
  src.start();
}
function stopAll() { [...playing].forEach(stopEntry); }

function visible() {
  const q = query.trim().toLowerCase();
  return sounds.filter(s => (activeCat === "all" || s.category === activeCat)
    && (palF === "all" || s.palette === palF)
    && (zoneF === "all" || s.zone === zoneF)
    && (fitF === "all" || (fitF === "hide" ? s.fit !== "off-theme" : s.fit === "core"))
    && (!q || [s.name, s.title, s.description, s.use_when, s.tags.join(" "), catLabel(s.category), s.zone, s.palette].join(" ").toLowerCase().includes(q)));
}
function render() {
  const shown = visible();
  $("status").textContent = `${shown.length} of ${sounds.length} sounds`;
  const list = $("list"); list.innerHTML = "";
  if (!shown.length) { list.innerHTML = '<div class="empty">No sounds match.</div>'; return; }
  for (const cat of [...new Set(shown.map(s => s.category))]) {
    const items = shown.filter(s => s.category === cat);
    const sec = document.createElement("section");
    const info = (TAX.categories && TAX.categories[cat]) || {};
    sec.innerHTML = `<h2>${catLabel(cat)}<small>${items.length}${info.description ? " · " + info.description : ""}</small></h2><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    for (const s of items) {
      const row = document.createElement("div");
      row.className = "row"; row.tabIndex = 0; row.setAttribute("role", "button"); row.title = s.loop ? "Click to play looped; click again to stop" : "Click to play";
      const badges = [`<span class="badge ${s.palette}">${s.palette}</span>`];
      if (s.zone !== "any") badges.push(`<span class="badge">${zoneName(s.zone)}</span>`);
      if (s.fit === "off-theme") badges.push('<span class="badge off">off-theme</span>');
      if (s.loop) badges.push('<span class="badge loop">loop</span>');
      row.innerHTML = `<div class="play">${s.loop ? "↻" : "▶"}</div>
        <div class="meta"><div class="name"></div><div class="desc"></div><div class="use"></div><div class="badges">${badges.join("")}</div></div>
        <div class="side">${s.seconds.toFixed(2)}s<a href="/api/sfx/${s.id}.wav" download="${s.name}.wav" title="Download as WAV">WAV ↓</a></div>
        <div class="bar-fill"></div>`;
      row.querySelector(".name").textContent = s.title;
      row.querySelector(".desc").textContent = s.description;
      row.querySelector(".use").textContent = s.use_when ? "Use: " + s.use_when : "";
      row.querySelector("a").onclick = e => e.stopPropagation();
      row.onclick = () => play(s, row);
      row.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(s, row); } };
      grid.appendChild(row);
    }
    list.appendChild(sec);
  }
}

function renderChips() {
  const cats = [...new Set(sounds.map(s => s.category))];
  $("chips").innerHTML = "";
  for (const [key, label] of [["all", `All (${sounds.length})`], ...cats.map(c => [c, `${catLabel(c)} (${sounds.filter(s => s.category === c).length})`])]) {
    const b = document.createElement("button");
    b.className = "chip" + (key === activeCat ? " on" : ""); b.textContent = label;
    b.onclick = () => { activeCat = key; renderChips(); render(); };
    $("chips").appendChild(b);
  }
}

$("q").oninput = e => { query = e.target.value; render(); };
$("pal").onchange = e => { palF = e.target.value; render(); };
$("zone").onchange = e => { zoneF = e.target.value; render(); };
$("fit").onchange = e => { fitF = e.target.value; render(); };
$("vol").oninput = e => { if (master) master.gain.value = parseFloat(e.target.value); };
$("stop").onclick = stopAll;
$("renderall").onclick = async () => {
  $("status").textContent = "rendering…";
  try {
    const r = await fetch("/api/sfx/render", { method: "POST" }), body = await r.json();
    if (!r.ok) throw new Error(body.error || r.statusText);
    $("status").textContent = `rendered ${body.count} sounds to ${body.folder}/`;
  } catch (e) { alert("Render failed: " + e.message); }
};
window.addEventListener("keydown", e => { if (e.key === "Escape") stopAll(); });

(async function init() {
  try {
    const r = await fetch("/api/sfx"); if (!r.ok) throw new Error(r.statusText);
    const payload = await r.json(); TAX = payload.taxonomy || {}; sounds = payload.sounds;
    $("zone").innerHTML = '<option value="all">all</option><option value="any">no specific zone</option>' +
      Object.entries(TAX.zones || {}).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join("");
  } catch (e) { $("list").innerHTML = `<div class="empty">Couldn't load sounds: ${e.message}. Start the server with: python3 -m sound_bytes.server</div>`; return; }
  renderChips(); render();
  let i = 0;                       // pre-render in the background so every click is instant
  (function warm() { while (i < sounds.length && sounds[i].loop) i++;      // long loops render on first click instead
    if (i < sounds.length) { samplesFor(sounds[i++]); setTimeout(warm, 0); } })();
})();
</script>
</body>
</html>
